name: Archive pages
on:
  schedule:
    - cron: 12 */6 * * *
  workflow_dispatch:
permissions:
  contents: read
jobs:
  get_pages:
    runs-on: ubuntu-latest
    steps:
      - name: Check out code.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Retrieve all pages
        run: |
          PAGES=$(./all-pages.sh)
          echo "pages=$PAGES" >> $GITHUB_OUTPUT
        id: pages
    outputs:
      pages: ${{ steps.pages.outputs.pages }}
  archive:
    needs: get_pages
    if: needs.get_pages.outputs.pages != '[]'
    strategy:
      fail-fast: false
      matrix:
        url: ${{ fromJson(needs.get_pages.outputs.pages) }}
    runs-on: ubuntu-latest
    steps:
      - uses: JamieMagee/wayback@e561c5018fb0e62988fddd732fb88345a3faa608 # v2.2.0
        with:
          url: ${{ matrix.url }}
          saveErrors: false
          saveOutlinks: true
          saveScreenshot: true
